name: ReviewAI — Evaluator

on:
  pull_request:
    types: [closed]

jobs:
  evaluate:
    name: 5x Re-run Evaluation
    runs-on: ubuntu-latest
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reviewer/requirements.txt

      - name: Install dependencies
        run: pip install -r reviewer/requirements.txt

      - name: Run 5x Evaluator
        working-directory: reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "reviewai"
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          EVAL_RUNS: "5"
        run: python -m evaluator.entry

      - name: Upload evaluation log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewai-eval-pr-${{ github.event.pull_request.number }}
          path: reviewer/reviewai_evaluation.jsonl
          if-no-files-found: ignore
          retention-days: 90
