name: ReviewAI — Commenter

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    name: AI Code Review
    runs-on: ubuntu-latest
    if: github.event.pull_request.head.repo.full_name == github.repository

    concurrency:
      group: reviewai-commenter-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: reviewer/requirements.txt

      - name: Install dependencies
        run: pip install -r reviewer/requirements.txt

      - name: Run Commenter
        working-directory: reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "reviewai"
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          DRY_RUN: "false"
          BOT_USERNAME: "github-actions[bot]"
        run: python -m commenter.entry

      - name: Upload review log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewai-commenter-pr-${{ github.event.pull_request.number }}
          path: reviewer/reviewai_feedback.jsonl
          if-no-files-found: ignore
          retention-days: 90
